{% extends 'base.html' %}

{% block content %}

<div class="kusi-wrapper">

    <div class="kusi-form-card">

        <div class="section-label">Yard Management</div>
        <h1 class="page-title">Create Yard</h1>

        <div class="kusi-card">

            <div class="kusi-card-header">
                <h4>Yard Details</h4>
            </div>

            <div class="kusi-card-body">

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mt-3" style="display:flex; gap:16px; margin-top:8px;">
                        <button
                            type="submit"
                            class="btn-kusi btn-kusi-primary">
                            Create Yard
                        </button>

                        <a
                            href="{% url 'yard_list' %}"
                            class="btn-kusi btn-kusi-secondary">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
